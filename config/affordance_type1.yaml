# AffordanceType1Pipeline Configuration
hand_only: true
text_prompt: "robot arm"
debug: true
output_dir: "output"

# EMA smoothing for centroid trajectory
ema_alpha: 0.9  # EMA smoothing factor (0 < alpha <= 1), higher = follows raw more closely

# Model configurations
gemma:
  model_id: google/gemma-2-2b-it

sam3:
  model_id: facebook/sam3
  gpus_to_use: [0]  # null uses all available GPUs, or specify list like [0, 1]